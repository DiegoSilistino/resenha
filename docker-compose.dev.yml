# OPCIONAL. O `npm run dev` já baixa e inicia o LiveKit sozinho, sem Docker.
# Use este arquivo só se preferir rodar o LiveKit no Docker:
#   docker compose -f docker-compose.dev.yml up -d
#   npm run dev   (ele detecta o LiveKit já rodando e usa este)

services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
