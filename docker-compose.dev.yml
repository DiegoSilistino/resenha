# Desenvolvimento: só o LiveKit, em modo --dev (chave "devkey", segredo "secret").
#   docker compose -f docker-compose.dev.yml up
# Depois, em outro terminal: npm run dev  (e abra http://localhost:5173)

services:
  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
